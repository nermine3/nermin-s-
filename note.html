
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>empty pagee</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg,#590209, #732b0c,#1e110c);
    color: #1f1818;
    position: relative;
}

/* NOTEBOOK */
.notebook {
    width: min(100%, 650px);
    padding: 30px;
    border: 1px solid white;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.88);
    box-shadow: 0 15px 50px#792b0b;
    text-align: center;
    position: relative;
    z-index: 2;
}

.flower {
    font-size: 45px;
    animation: sway 3s ease-in-out infinite;
}

@keyframes sway {
    50% {
        transform: rotate(12deg);
    }
}

/* GIF DECORATION */



.side-gif {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 25vw;
    height: 55vh;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
}

.side-gif:not(.second-gif) {
    left: 0;
}

.side-gif.second-gif {
    left: auto;
    right: 0;
    width: 27vw;
}




h1 {
    color:#50070c;
    font-size: clamp(25px, 6vw, 36px);
}

.intro {
    line-height: 1.8;
}

textarea {
    display: block;
    width: 100%;
    min-height: 350px;
    margin-top: 25px;
    padding: 20px;
    resize: vertical;
    border: 1px solid #dfb9e6;
    border-radius: 18px;
    outline: none;
    background: #020a0c;
    color:#86979b;
    font-family: Georgia, serif;
    font-size: 16px;
    line-height: 1.9;
}

textarea:focus {
    border-color: #1f0b0c;
    box-shadow: 0 0 12px #cef3c4;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #1e0e11;
    color:#367127;
    font-family: Georgia, serif;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #59709c;
}

#saveStatus {
    min-height: 24px;
    margin-top: 12px;
    font-size: 13px;
    opacity: 0.8;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #d66e00;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    text-decoration: underline;
}

.small {
    margin-top: 25px;
    font-size: 11px;
    opacity: 0.7;
}

/* KEEP THE GIF FROM CROWDING THE NOTEBOOK ON SMALL SCREENS */
@media (max-width: 900px) {
    .side-gif {
        position: absolute;
        right: 8px;
        top: 8px;
        transform: none;
        width: 85px;
        max-height: 100px;
        opacity: 0.85;
    }

    .notebook {
        padding: 25px 20px;
        z-index: 2;
    }
}
    
#musicButton {
    width: auto;
    padding: 10px 18px;
    margin: 12px 0;
    border: 1px solid#1c1935;
    border-radius: 20px;
    background:#1c1935;
    color: #964407;
    cursor: pointer;
}
    
    

.intro-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.intro-gif {
    width: 120px;
    height: 120px;
    object-fit: contain;
}



</style>
</head>

<body>

<img
    class="side-gif"
    src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3hzeGIzejhqcnE1ZmM3a3V3bXNjOG13MHczNHVvNXZjYXV6cjU4cSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/VFHa3Kg39gFLVbinN1/giphy.gif"
    alt="Cute animated decoration"
>
    
<img
    class="side-gif second-gif"
    src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3eDNreWhhcnR6ZjFwM3N2c2w5Yzh1ZXdzMWY0OTFucGxtbzBsNXQ3YSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Qgfz2N36MgUBG/giphy.gif"
    alt="Another cute decoration"
>



<main class="notebook">

    <div class="flower"> 🐇 </div>
    
<button id="musicButton" type="button">♫ Music: OFF</button>

<div id="musicPlayer" style="display:none;"></div>



    <h1>♡</h1>

<div class="intro-row">
    <span>A little space</span>
    <img
        class="intro-gif"
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnFwaWtqdDVoZWJ5djN0Z25xdHJ5aXV3Yjg3MTMyczBuYzVnang4cyZlcD12MV9naWZzX3JlbGF0ZWQmY3Q9Zw/ihoMDs9ZIY7IvP8Fgh/giphy.gif"
        alt="Tiny decoration"
    >
</div>

<p>Just write.</p>


    <textarea
        id="myNote"
        placeholder="... 𓍢ִ໋🌷͙֒

Write  here...

thoughts."
        spellcheck="false"
    ></textarea>

    <button id="saveButton">Save ♡</button>

    <div id="saveStatus" aria-live="polite">
        notebook is ready.
    </div>

    <a class="back" href="index.html">← Return</a>

    <p class="small">hii</p>

</main>

<script>
const note = document.getElementById("myNote");
const saveButton = document.getElementById("saveButton");
const saveStatus = document.getElementById("saveStatus");

// LOAD YOUR PREVIOUS NOTE
note.value = localStorage.getItem("secretGardenNote") || "";

// SAVE THE NOTE
function saveNote() {
    try {
        localStorage.setItem("secretGardenNote", note.value);
        saveStatus.textContent = "Saved. Your little universe is safe. ♡";
    } catch (error) {
        saveStatus.textContent =
            "Couldn't save. Your browser storage may be unavailable.";
    }
}

// SAVE AUTOMATICALLY WHEN YOU WRITE
note.addEventListener("input", saveNote);

// SAVE BUTTON
saveButton.addEventListener("click", saveNote);
   
const musicButton = document.getElementById("musicButton");
const musicPlayer = document.getElementById("musicPlayer");

const videoID = "Fy9-mskmhQ8&list=RDFy9-mskmhQ8&start_radio=1";
let musicOn = false;

musicButton.addEventListener("click", function () {
    if (!musicOn) {
        musicPlayer.innerHTML = `
            <iframe
                width="1"
                height="1"
                src="https://www.youtube.com/embed/${videoID}?autoplay=1&loop=1&playlist=${videoID}"
                allow="autoplay; encrypted-media"
                title="Background music">
            </iframe>
        `;

        musicButton.textContent = "♫ Music: ON";
        musicOn = true;
    } else {
        musicPlayer.innerHTML = "";
        musicButton.textContent = "♫ Music: OFF";
        musicOn = false;
    }
});


</script>

</body>
</html>
