
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>empty pagee</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #fce4ec, #eadcf8, #d9eaf7);
    color: #684a70;
    position: relative;
}

/* NOTEBOOK */
.notebook {
    width: min(100%, 650px);
    padding: 30px;
    border: 1px solid white;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.88);
    box-shadow: 0 15px 50px #b99ac755;
    text-align: center;
    position: relative;
    z-index: 2;
}

.flower {
    font-size: 45px;
    animation: sway 3s ease-in-out infinite;
}

@keyframes sway {
    50% {
        transform: rotate(12deg);
    }
}

/* GIF DECORATION */
.side-gif {
    position: fixed;
    right: max(15px, calc((100vw - 1050px) / 2));
    top: 50%;
    transform: translateY(-50%);
    width: clamp(100px, 16vw, 190px);
    height: auto;
    max-height: 70vh;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
}
    .second-gif {
    right: auto;
    left: max(15px, calc((100vw - 1050px) / 2));
}

h1 {
    color: #b16e9c;
    font-size: clamp(25px, 6vw, 36px);
}

.intro {
    line-height: 1.8;
}

textarea {
    display: block;
    width: 100%;
    min-height: 350px;
    margin-top: 25px;
    padding: 20px;
    resize: vertical;
    border: 1px solid #dfb9e6;
    border-radius: 18px;
    outline: none;
    background: #fffafd;
    color: #684a70;
    font-family: Georgia, serif;
    font-size: 16px;
    line-height: 1.9;
}

textarea:focus {
    border-color: #b16e9c;
    box-shadow: 0 0 12px #dfb9e688;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #e8c5e9;
    color: #684a70;
    font-family: Georgia, serif;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #d8a9df;
}

#saveStatus {
    min-height: 24px;
    margin-top: 12px;
    font-size: 13px;
    opacity: 0.8;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #a36eaa;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    text-decoration: underline;
}

.small {
    margin-top: 25px;
    font-size: 11px;
    opacity: 0.7;
}

/* KEEP THE GIF FROM CROWDING THE NOTEBOOK ON SMALL SCREENS */
@media (max-width: 900px) {
    .side-gif {
        position: absolute;
        right: 8px;
        top: 8px;
        transform: none;
        width: 85px;
        max-height: 100px;
        opacity: 0.85;
    }

    .notebook {
        padding: 25px 20px;
    }
}
</style>
</head>

<body>

<img
    class="side-gif"
    src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3hzeGIzejhqcnE1ZmM3a3V3bXNjOG13MHczNHVvNXZjYXV6cjU4cSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/VFHa3Kg39gFLVbinN1/giphy.gif"
    alt="Cute animated decoration"
>
    
<img
    class="side-gif second-gif"
    src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3eDNreWhhcnR6ZjFwM3N2c2w5Yzh1ZXdzMWY0OTFucGxtbzBsNXQ3YSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Qgfz2N36MgUBG/giphy.gif"
    alt="Another cute decoration"
>



<main class="notebook">

    <div class="flower">🌷 🐇 🌷</div>

    <h1>♡</h1>

    <p class="intro">
        A little space
        <br><br>
        Just write.
    </p>

    <textarea
        id="myNote"
        placeholder="... 𓍢ִ໋🌷͙֒

Write  here...

thoughts."
        spellcheck="false"
    ></textarea>

    <button id="saveButton">Save ♡</button>

    <div id="saveStatus" aria-live="polite">
        notebook is ready.
    </div>

    <a class="back" href="index.html">← Return</a>

    <p class="small">hii</p>

</main>

<script>
const note = document.getElementById("myNote");
const saveButton = document.getElementById("saveButton");
const saveStatus = document.getElementById("saveStatus");

// LOAD YOUR PREVIOUS NOTE
note.value = localStorage.getItem("secretGardenNote") || "";

// SAVE THE NOTE
function saveNote() {
    try {
        localStorage.setItem("secretGardenNote", note.value);
        saveStatus.textContent = "Saved. Your little universe is safe. ♡";
    } catch (error) {
        saveStatus.textContent =
            "Couldn't save. Your browser storage may be unavailable.";
    }
}

// SAVE AUTOMATICALLY WHEN YOU WRITE
note.addEventListener("input", saveNote);

// SAVE BUTTON
saveButton.addEventListener("click", saveNote);
</script>

</body>
</html>
