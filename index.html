
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>space ݁ ˖Ი𐑼⋆</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #fce4ec, #eadcf8, #d9eaf7);
    color: #684a70;
    overflow: hidden;
    transition: background 0.5s ease;
}

/* FALLING DECORATIONS */

.petal {
    position: fixed;
    top: -30px;
    z-index: 1;
    animation: fall 8s linear infinite;
    pointer-events: none;
    user-select: none;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

/* MAIN CARD */

.card {
    position: relative;
    z-index: 2;
    width: min(90%, 420px);
    max-height: 90vh;
    overflow-y: auto;
    padding: 35px 25px;
    text-align: center;
    border: 1px solid white;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.65);
    box-shadow: 0 15px 50px #b99ac755;
}

.flower {
    font-size: 48px;
    animation: sway 3s ease-in-out infinite;
}

@keyframes sway {
    50% {
        transform: rotate(12deg);
    }
}

h1 {
    color: #b16e9c;
    font-size: 36px;
}

p {
    line-height: 1.7;
}

/* INPUT */

input {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #dfb9e6;
    border-radius: 14px;
    font-size: 16px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #b16e9c;
    box-shadow: 0 0 12px #dfb9e688;
}

/* BUTTONS */

button,
.continue-link {
    display: inline-block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #e8c5e9;
    color: #684a70;
    font-family: Georgia, serif;
    font-size: 15px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover,
.continue-link:hover {
    background: #d8a9df;
}

#result {
    margin-top: 22px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.small {
    font-size: 11px;
    opacity: 0.7;
}

/* WRONG NAME: ORIGINAL SHAKE */

.shake {
    animation: shake 1.5s ease-in-out;
}

@keyframes shake {
    0%, 100% {
        transform: translate(0, 0) rotate(0);
    }

    10% {
        transform: translate(12px, -5px) rotate(3deg);
    }

    20% {
        transform: translate(-15px, 4px) rotate(-4deg);
    }

    30% {
        transform: translate(12px, -6px) rotate(3deg);
    }

    40% {
        transform: translate(-15px, 0) rotate(-4deg);
    }

    50% {
        transform: translate(10px, -5px) rotate(3deg);
    }

    60% {
        transform: translate(-12px, 0) rotate(-3deg);
    }

    80% {
        transform: translate(5px, 0) rotate(1deg);
    }
}

/* WRONG NAME: ANGRY EMOJI */

.angry-doom {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 9999;
    font-size: 80px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: angryApocalypse 3s ease-in-out forwards;
}

@keyframes angryApocalypse {
    0%, 100% {
        transform: translate(-50%, -50%) scale(0);
    }

    10% {
        transform: translate(-50%, -50%) scale(1);
    }

    45% {
        transform: translate(-50%, -50%) scale(15);
    }

    65% {
        transform: translate(-50%, -50%) scale(25);
    }

    80% {
        transform: translate(-50%, -50%) scale(10);
    }
}

/* WRONG NAME: SCREEN SHAKE */

.screen-shake {
    animation: screenShake 0.5s ease-in-out;
}

@keyframes screenShake {
    0%, 100% {
        transform: translate(0, 0);
    }

    20% {
        transform: translate(-5px, 3px);
    }

    40% {
        transform: translate(5px, -3px);
    }

    60% {
        transform: translate(-4px, -2px);
    }

    80% {
        transform: translate(4px, 2px);
    }
}

/* WRONG NAME: RED ALERT */

.red-alert {
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    background: rgba(255, 0, 50, 0.12);
    animation: alertFlash 0.3s ease-in-out 4;
}

@keyframes alertFlash {
    0%, 100% {
        opacity: 0;
    }

    50% {
        opacity: 1;
    }
}

/* NEW: PURPLE VERIFICATION SHAKE */

.purple-alert {
    position: fixed;
    inset: 0;
    z-index: 9996;
    pointer-events: none;
    background: rgba(153, 51, 255, 0.28);
    animation: purpleFlash 0.22s ease-in-out 5;
}

@keyframes purpleFlash {
    0%, 100% {
        opacity: 0;
    }

    50% {
        opacity: 1;
    }
}

.purple-shake {
    animation: purpleShake 0.75s ease-in-out;
}

@keyframes purpleShake {
    0%, 100% {
        transform: translate(0, 0);
        filter: hue-rotate(0deg);
    }

    15% {
        transform: translate(-8px, 4px) rotate(-1deg);
        filter: hue-rotate(35deg);
    }

    30% {
        transform: translate(8px, -4px) rotate(1deg);
        filter: hue-rotate(75deg);
    }

    45% {
        transform: translate(-7px, -3px) rotate(-1deg);
        filter: hue-rotate(120deg);
    }

    60% {
        transform: translate(7px, 3px) rotate(1deg);
        filter: hue-rotate(180deg);
    }

    80% {
        transform: translate(-3px, 2px);
        filter: hue-rotate(240deg);
    }
}

/* NEW: HAPPY CELEBRATION OVERLAY */

.celebration {
    position: fixed;
    inset: 0;
    z-index: 9997;
    pointer-events: none;
    background: linear-gradient(
        120deg,
        rgba(255, 80, 180, 0.20),
        rgba(120, 80, 255, 0.20),
        rgba(50, 220, 255, 0.20),
        rgba(255, 230, 70, 0.20),
        rgba(90, 255, 170, 0.20)
    );
    background-size: 400% 400%;
    animation: rainbowBackground 2s ease-in-out;
}

@keyframes rainbowBackground {
    0% {
        opacity: 0;
        background-position: 0% 50%;
    }

    25% {
        opacity: 1;
        background-position: 100% 50%;
    }

    50% {
        opacity: 0.85;
        background-position: 0% 100%;
    }

    75% {
        opacity: 1;
        background-position: 100% 0%;
    }

    100% {
        opacity: 0;
        background-position: 0% 50%;
    }
}

/* EVERYTHING SHAKES HAPPILY */

.happy-shake {
    animation: happyShake 0.65s ease-in-out 3;
}

@keyframes happyShake {
    0%, 100% {
        transform: translate(0, 0) rotate(0) scale(1);
    }

    10% {
        transform: translate(-9px, -6px) rotate(-2deg) scale(1.02);
    }

    20% {
        transform: translate(9px, 5px) rotate(2deg) scale(1.04);
    }

    30% {
        transform: translate(-8px, 4px) rotate(-2deg) scale(1.02);
    }

    40% {
        transform: translate(8px, -5px) rotate(2deg) scale(1.05);
    }

    50% {
        transform: translate(-6px, -3px) rotate(-1deg) scale(1.03);
    }

    60% {
        transform: translate(6px, 4px) rotate(1deg) scale(1.04);
    }

    80% {
        transform: translate(-3px, 2px) rotate(-1deg) scale(1.01);
    }
}

/* COLORFUL CONFETTI */

.confetti {
    position: fixed;
    top: -30px;
    z-index: 10000;
    pointer-events: none;
    animation: confettiFall 2.5s ease-in forwards;
}

@keyframes confettiFall {
    0% {
        transform: translateY(-10vh) rotate(0deg) scale(0.5);
        opacity: 0;
    }

    10% {
        opacity: 1;
        transform: translateY(5vh) rotate(90deg) scale(1);
    }

    100% {
        transform: translateY(115vh) rotate(900deg) scale(0.7);
        opacity: 0;
    }
}

/* REDUCE MOTION ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
    .petal,
    .flower {
        animation: none;
    }
}
</style>
</head>

<body>

<div id="petals"></div>

<main class="card" id="card">

    <div class="flower">🍓</div>

    <h1>nermin's</h1>

    <p>
        A space.<br>

        <img
            src="https://user-images.githubusercontent.com/74038190/226190908-cd4e0a61-801d-4b69-955b-5bd82eb7c10e.gif"
            alt="Cute animation"
            width="120"
        ><br>

        HMM Who's trying to get in?
    </p>

    <form id="nameForm">

        <input
            id="name"
            type="text"
            placeholder="your name"
            autocomplete="off"
            required
        >

        <button type="submit">Open the door</button>

    </form>

    <div id="result" aria-live="polite"></div>

    <p class="small">pixels :p ♡</p>

</main>

<!-- MUSIC PLAYER -->

<div
    id="musicPlayer"
    style="position:fixed;width:1px;height:1px;overflow:hidden;"
></div>

<script>

/* =========================================
   YOUR THREE YOUTUBE MUSIC SLOTS
   Paste ONLY the code after v= in each URL.
   ========================================= */

// 1. Reception music: plays when the page opens.
const receptionSongID = "OxUs1Xd3i3M";

// 2. Music when your name is accepted.
const acceptanceSongID = "H5CR1dNOA-I";

// 3. Music when the wrong name is entered.
const rejectionSongID = "lYKKdw_d2Hw";


/* ACCEPTED NAMES */

const acceptedNames = [
    "nermine",
    "nermin",
    "nermi",
    "ner",
    "nerr",
    "nerner",
    "nerin",
    "nr",
    "nermina"
];


/* ELEMENTS */

const form = document.getElementById("nameForm");
const input = document.getElementById("name");
const result = document.getElementById("result");
const card = document.getElementById("card");
const musicPlayer = document.getElementById("musicPlayer");


let currentMusic = null;
let preparedAcceptancePlayer = null;
let preparedRejectionPlayer = null;

function createPlayer(videoID, autoplay = true) {
    const player = document.createElement("iframe");

    player.width = "1";
    player.height = "1";

    player.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoID) +
        "?autoplay=" + (autoplay ? "1" : "0") +
        "&playsinline=1&controls=0";

    player.allow = "autoplay; encrypted-media";
    player.title = "Secret Garden music";

    return player;
}

function stopMusic() {
    musicPlayer.innerHTML = "";
    currentMusic = null;
    preparedAcceptancePlayer = null;
}

function playSong(videoID) {
    stopMusic();

    if (!videoID || videoID.startsWith("PUT_")) return;

    currentMusic = videoID;

    const player = createPlayer(videoID, true);

    musicPlayer.appendChild(player);
}

window.addEventListener("load", function() {
    // Start reception music.
    if (
        receptionSongID &&
        !receptionSongID.startsWith("PUT_")
    ) {
        currentMusic = receptionSongID;
        musicPlayer.appendChild(
            createPlayer(receptionSongID, true)
        );
    }

    // Prepare the acceptance player in advance.
    // It loads the video without intentionally starting playback.
    if (
        acceptanceSongID &&
        !acceptanceSongID.startsWith("PUT_")
    ) {
        preparedAcceptancePlayer = createPlayer(
            acceptanceSongID,
            false
        );

        preparedAcceptancePlayer.style.display = "none";

        document.body.appendChild(preparedAcceptancePlayer);
    }
    // Preload rejection music in advance.
if (rejectionSongID && !rejectionSongID.startsWith("PUT_")) {
    preparedRejectionPlayer = createPlayer(rejectionSongID, false);
    preparedRejectionPlayer.style.display = "none";
    document.body.appendChild(preparedRejectionPlayer);
}
});



/* =========================================
   RESET OLD ANIMATIONS
   ========================================= */

function clearEffects() {

    card.classList.remove(
        "shake",
        "purple-shake",
        "happy-shake"
    );

    document.body.classList.remove("screen-shake");

    document.querySelectorAll(
        ".angry-doom, .red-alert, .purple-alert, .celebration, .confetti"
    ).forEach(element => element.remove());

}


/* =========================================
   PURPLE VERIFICATION EFFECT
   ========================================= */

function purpleVerification() {

    void card.offsetWidth;

    card.classList.add("purple-shake");

    document.body.classList.add("screen-shake");

    const alert = document.createElement("div");

    alert.className = "purple-alert";

    document.body.appendChild(alert);

    setTimeout(() => {
        alert.remove();
    }, 1200);

    setTimeout(() => {
        card.classList.remove("purple-shake");
        document.body.classList.remove("screen-shake");
    }, 900);

}


/* =========================================
   HAPPY RAINBOW CELEBRATION
   ========================================= */

function happyCelebration() {

    // Colorful full-screen overlay.
    const celebration = document.createElement("div");

    celebration.className = "celebration";

    document.body.appendChild(celebration);

    setTimeout(() => {
        celebration.remove();
    }, 7000);


    // Shake the card happily.
    void card.offsetWidth;

    card.classList.add("happy-shake");

    setTimeout(() => {
        card.classList.remove("happy-shake");
    }, 2000);


    // Shake the whole screen.
    document.body.classList.add("screen-shake");

    setTimeout(() => {
        document.body.classList.remove("screen-shake");
    }, 600);


    // Colorful falling confetti.

    // Colorful falling confetti — slower and longer.
    const colors = [
        "#ff69b4", "#c084fc", "#60a5fa", "#facc15",
        "#4ade80", "#fb7185", "#a78bfa", "#ffffff",
        "#ff9f43", "#22d3ee"
    ];

    const shapes = ["✦", "♡", "✿", "★", "✧", "♥", "❀"];

    for (let i = 0; i < 120; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.textContent = shapes[Math.floor(Math.random() * shapes.length)];

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.color = colors[Math.floor(Math.random() * colors.length)];
        piece.style.fontSize = (14 + Math.random() * 24) + "px";

        piece.style.animationDuration = (5 + Math.random() * 4) + "s";
        piece.style.animationDelay = (Math.random() * 1.5) + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        }, 11000);
    }


}


/* =========================================
   NAME VERIFICATION
   ========================================= */

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = input.value.trim().toLowerCase();

    // Remove previous visual effects.
    clearEffects();


    /* ACCEPTED NAME */

    if (acceptedNames.includes(name)) {

        result.innerHTML = `
            <div style="font-size:36px">
                𓍢ִ໋ 🐇 𓍢ִ໋
            </div>

            <strong>˚₊‧꒰ა 𓂋 ໒꒱ ‧₊˚</strong><br>

            °❀.ೃ࿔*⟡ welcome back! °❀.ೃ࿔*♡<br>

            Come in ♡<br><br>

            <a class="continue-link" href="choice.html">
                Enter here ♡
            </a>
        `;

    
// Switch music immediately.
stopMusic();

if (preparedAcceptancePlayer) {
    preparedAcceptancePlayer.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(acceptanceSongID) +
        "?autoplay=1&playsinline=1&controls=0";

    musicPlayer.appendChild(preparedAcceptancePlayer);

    preparedAcceptancePlayer.style.display = "block";

    currentMusic = acceptanceSongID;
    preparedAcceptancePlayer = null;
} else {
    playSong(acceptanceSongID);
}

// Start visual effects immediately.
purpleVerification();
happyCelebration();


    }


    /* REJECTED NAME */

    else {

        result.innerHTML = `
            <div style="font-size:42px">
                🚪🐈‍⬛
            </div>

            <strong>UMMMM... EXCUSE ME???</strong><br>

            WRONG ANSWER.. 🤬<br>

            WHO INVITED YOU????<br>

            THIS IS A PRIVATE TERRITORY.<br>

            CAN'T YOU SEE??!<br>

            <strong>LEAVE. NOW!!! THANK YOU.</strong>
        `;

        // Original card shake.
        void card.offsetWidth;

        card.classList.add("shake");

        // Original screen shake.
        void document.body.offsetWidth;

        document.body.classList.add("screen-shake");

        // Red alert.
        const alert = document.createElement("div");

        alert.className = "red-alert";

        document.body.appendChild(alert);

        setTimeout(() => {
            alert.remove();
        }, 7000);

        // Giant angry emoji.
        const doom = document.createElement("div");

        doom.className = "angry-doom";

        doom.textContent = "🤬";

        document.body.appendChild(doom);

        setTimeout(() => {
            doom.remove();
        }, 3000);

        // Stop reception music and play rejection music.
       stopMusic();

if (preparedRejectionPlayer) {
    preparedRejectionPlayer.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(rejectionSongID) +
        "?autoplay=1&playsinline=1&controls=0";

    musicPlayer.appendChild(preparedRejectionPlayer);

    preparedRejectionPlayer.style.display = "block";

    currentMusic = rejectionSongID;
    preparedRejectionPlayer = null;

} else {
    playSong(rejectionSongID);
}

    }

});


/* =========================================
   FALLING DECORATIONS
   ========================================= */

const decorations = [
    "🙀", "♡", "✿", "⭐", "🦋", "✧", "🌸",
    "❤︎", "˚˖𓍢ִ໋", "🐰", "🦋", "🍓", "´ཀ`",
    "🍓"
];

for (let i = 0; i < 22; i++) {

    const petal = document.createElement("div");

    petal.className = "petal";

    petal.textContent =
        decorations[Math.floor(Math.random() * decorations.length)];

    petal.style.left = Math.random() * 100 + "vw";

    petal.style.animationDelay =
        Math.random() * 8 + "s";

    petal.style.animationDuration =
        (6 + Math.random() * 7) + "s";

    petal.style.fontSize =
        (12 + Math.random() * 18) + "px";

    document.getElementById("petals").appendChild(petal);

}

</script>

</body>
</html>
