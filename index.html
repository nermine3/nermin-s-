
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>space ݁ ˖Ი𐑼⋆</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #fce4ec, #eadcf8, #d9eaf7);
    color: #684a70;
    overflow: hidden;
}

.petal {
    position: fixed;
    top: -30px;
    z-index: 1;
    animation: fall 8s linear infinite;
    pointer-events: none;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
}

.card {
    position: relative;
    z-index: 2;
    width: min(90%, 420px);
    max-height: 90vh;
    overflow-y: auto;
    padding: 35px 25px;
    text-align: center;
    border: 1px solid white;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.65);
    box-shadow: 0 15px 50px #b99ac755;
}

.flower {
    font-size: 48px;
    animation: sway 3s ease-in-out infinite;
}

@keyframes sway {
    50% { transform: rotate(12deg); }
}

h1 {
    color: #b16e9c;
    font-size: 36px;
}

p { line-height: 1.7; }

input {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #dfb9e6;
    border-radius: 14px;
    font-size: 16px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #b16e9c;
    box-shadow: 0 0 12px #dfb9e688;
}

button, .continue-link {
    display: inline-block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #e8c5e9;
    color: #684a70;
    font-family: Georgia, serif;
    font-size: 15px;
    text-decoration: none;
    cursor: pointer;
}

button:hover, .continue-link:hover {
    background: #d8a9df;
}

#result {
    margin-top: 22px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.small {
    font-size: 11px;
    opacity: 0.7;
}

.shake { animation: shake 1.5s ease-in-out; }

@keyframes shake {
    0%, 100% { transform: translate(0,0) rotate(0); }
    10% { transform: translate(12px,-5px) rotate(3deg); }
    20% { transform: translate(-15px,4px) rotate(-4deg); }
    30% { transform: translate(12px,-6px) rotate(3deg); }
    40% { transform: translate(-15px,0) rotate(-4deg); }
    50% { transform: translate(10px,-5px) rotate(3deg); }
    60% { transform: translate(-12px,0) rotate(-3deg); }
    80% { transform: translate(5px,0) rotate(1deg); }
}

.angry-doom {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 9999;
    font-size: 80px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: angryApocalypse 3s ease-in-out forwards;
}

@keyframes angryApocalypse {
    0%, 100% { transform: translate(-50%,-50%) scale(0); }
    10% { transform: translate(-50%,-50%) scale(1); }
    45% { transform: translate(-50%,-50%) scale(15); }
    65% { transform: translate(-50%,-50%) scale(25); }
    80% { transform: translate(-50%,-50%) scale(10); }
}

.screen-shake { animation: screenShake 0.5s ease-in-out; }

@keyframes screenShake {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px,3px); }
    40% { transform: translate(5px,-3px); }
    60% { transform: translate(-4px,-2px); }
    80% { transform: translate(4px,2px); }
}

.red-alert {
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    background: rgba(255, 0, 50, 0.12);
    animation: alertFlash 0.3s ease-in-out 4;
}

@keyframes alertFlash {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
    .petal, .flower { animation: none; }
}
</style>
</head>

<body>

<div id="petals"></div>

<main class="card" id="card">
    <div class="flower">🍓</div>

    <h1>nermin's</h1>

    <p>
        A space.<br>
        <img
            src="https://user-images.githubusercontent.com/74038190/226190908-cd4e0a61-801d-4b69-955b-5bd82eb7c10e.gif"
            alt="Cute animation"
            width="120"
        ><br>
       HMM Who's trying to get in?
    </p>

    <form id="nameForm">
        <input
            id="name"
            type="text"
            placeholder="your name"
            autocomplete="off"
            required
        >
        <button type="submit">Open the door</button>
    </form>

    <div id="result" aria-live="polite"></div>

    <p class="small">pixels :p ♡</p>
</main>

<div id="musicPlayer" style="position:fixed;width:1px;height:1px;overflow:hidden;"></div>

<script>
// PUT ONLY THE VIDEO ID HERE.
// Example: https://www.youtube.com/watch?v=ABC123
// Video ID: ABC123

const acceptanceSongID = "H5CR1dNOA-I";

// Rejection song already in your original code:
const rejectionSongID = "lYKKdw_d2Hw";

const acceptedNames = [
    "nermine",
    "nermin",
    "nermi",
    "ner",
    "nerr",
    "nerner",
    "nerin",
    "nr",
    "nermina"
];

const form = document.getElementById("nameForm");
const input = document.getElementById("name");
const result = document.getElementById("result");
const card = document.getElementById("card");
const musicPlayer = document.getElementById("musicPlayer");

function playSong(videoID) {
    if (!videoID || videoID === "PUT_VIDEO_ID_HERE") return;

    musicPlayer.innerHTML = "";

    const player = document.createElement("iframe");

    player.width = "1";
    player.height = "1";
    player.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoID) +
        "?autoplay=1";

    player.allow = "autoplay; encrypted-media";
    player.title = "Garden music";

    musicPlayer.appendChild(player);
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = input.value.trim().toLowerCase();

    card.classList.remove("shake");
    document.querySelectorAll(".angry-doom, .red-alert")
        .forEach(element => element.remove());
    document.body.classList.remove("screen-shake");

    if (acceptedNames.includes(name)) {
        result.innerHTML = `
            <div style="font-size:36px">
                𓍢ִ໋ 🐇 𓍢ִ໋
            </div>
            <strong>˚₊‧꒰ა 𓂋 ໒꒱ ‧₊˚</strong><br>
            °❀.ೃ࿔*⟡ welcome back! °❀.ೃ࿔*♡<br>
            Come in ♡<br><br>
            <a class="continue-link" href="choice.html">
                Enter here ♡
            </a>
        `;

        // Play your acceptance song.
        playSong(acceptanceSongID);

    } else {
        result.innerHTML = `
            <div style="font-size:42px">🚪🐈‍⬛</div>
            <strong>UMMMM... EXCUSE ME???</strong><br>
            WRONG ANSWER.. 🤬<br>
            WHO INVITED YOU????<br>
            THIS IS A PRIVATE TERRITORY.<br>
            CAN'T YOU SEE??!<br>
            <strong>LEAVE. NOW!!! THANK YOU.</strong>
        `;

        void card.offsetWidth;
        card.classList.add("shake");

        void document.body.offsetWidth;
        document.body.classList.add("screen-shake");

        const alert = document.createElement("div");
        alert.className = "red-alert";
        document.body.appendChild(alert);

        setTimeout(() => alert.remove(), 1200);

        const doom = document.createElement("div");
        doom.className = "angry-doom";
        doom.textContent = "🤬";
        document.body.appendChild(doom);

        setTimeout(() => doom.remove(), 3000);

        playSong(rejectionSongID);
    }
});

const decorations = [
    "🙀", "♡", "✿", "⭐", "🦋", "✧", "🌸",
    "❤︎", "˚˖𓍢ִ໋", "🐰",
    "🦋", "🍓", "´ཀ`",
    "🍓"
];

for (let i = 0; i < 22; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";

    petal.textContent =
        decorations[Math.floor(Math.random() * decorations.length)];

    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDelay = Math.random() * 8 + "s";
    petal.style.animationDuration = (6 + Math.random() * 7) + "s";
    petal.style.fontSize = (12 + Math.random() * 18) + "px";

    document.getElementById("petals").appendChild(petal);
}
</script>

</body>
</html>
